<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <title>Bubersurprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,100;1,9..144,300..500,100&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=7">
  <style>
    html, body { overflow: hidden; height: 100dvh; }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      gap: 22px;
      z-index: 1;
    }

    .top { text-align: center; }
    .top h1 { font-size: clamp(1.8rem, 8vw, 2.3rem); max-width: 18ch; }
    .top p { margin-top: 8px; color: var(--muted); font-size: 0.95rem; }

    .board {
      display: grid;
      gap: 10px;
      width: min(100%, 420px);
      perspective: 900px;
    }
    .card {
      position: relative;
      aspect-ratio: 3 / 4;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .card.open, .card.done { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid; place-items: center;
      overflow: hidden;
    }
    /* dorso: incassato, come le celle del PIN */
    .back {
      background: var(--paper-deep);
      box-shadow: inset 0 2px 6px rgba(31, 29, 26, 0.06);
    }
    .back::after {
      content: '';
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(31, 29, 26, 0.12);
    }
    /* fronte: chiaro, con l'immagine */
    .front {
      transform: rotateY(180deg);
      background: var(--paper-light);
      box-shadow: 0 1px 2px rgba(31, 29, 26, 0.05);
      padding: 8px;
      transition: background 0.3s, border-color 0.3s;
    }
    .front img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .card.done .front { background: var(--sage); border-color: var(--ok); }
    .card.wrong .front { background: var(--blush); border-color: var(--bad); }
    .card.done { cursor: default; }

    #end { text-align: center; }
    #end h2 { font-size: clamp(1.9rem, 8vw, 2.4rem); max-width: 18ch; margin: 0 auto 30px; }
  </style>
</head>
<body>

  <section id="game" class="screen">
    <div class="top">
      <h1 id="title">Memory</h1>
      <p id="count"></p>
    </div>
    <div class="board" id="board" aria-label="Memory"></div>
  </section>

  <section id="end" class="screen hidden">
    <div class="rise">
      <h2 id="end-title">Tutte le coppie.</h2>
      <a class="btn" id="next" href="#">Avanti</a>
    </div>
  </section>

  <script src="shared.js?v=7"></script>
  <script>
    Buber.requireStep(4);

    /* ============================================================
       CONFIG — modifica qui
       ============================================================ */
    const CONFIG = {
      title: 'Memory',
      // un'immagine per coppia. SEGNAPOSTO: i ritagli già presenti, da sostituire con le immagini vere.
      images: [
        'img/people/cut/bubi1.webp',
        'img/people/cut/bubi2.webp',
        'img/people/cut/bubi3.webp',
        'img/people/cut/gere1.webp',
        'img/people/cut/mara.webp',
        'img/people/cut/snoop.webp',
      ],
      cols: 3,                 // colonne della griglia (3 → 4 righe con 6 coppie; 4 → 4 righe con 8 coppie)
      count: (found, total) => `${found} / ${total} coppie`,
      endTitle: 'Tutte le coppie.',
      next: '4-finale.html',
    };

    const $ = (s) => document.querySelector(s);
    $('#title').textContent = CONFIG.title;
    $('#end-title').textContent = CONFIG.endTitle;
    $('#next').href = CONFIG.next;

    const board = $('#board');
    board.style.gridTemplateColumns = `repeat(${CONFIG.cols}, 1fr)`;

    // mazzo: ogni immagine due volte, mescolato
    const deck = CONFIG.images.flatMap((src, i) => [{ src, id: i }, { src, id: i }]);
    for (let i = deck.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }

    const cards = deck.map((d) => {
      const c = document.createElement('div'); c.className = 'card'; c.dataset.id = d.id;
      c.innerHTML = `<div class="face back"></div><div class="face front"><img src="${d.src}" alt=""></div>`;
      board.appendChild(c);
      return c;
    });

    let open = [], lock = false, found = 0;
    const total = CONFIG.images.length;
    const paintCount = () => { $('#count').textContent = CONFIG.count(found, total); };
    paintCount();

    board.addEventListener('click', (e) => {
      const c = e.target.closest('.card');
      if (!c || lock || c.classList.contains('open') || c.classList.contains('done')) return;
      Buber.sound.unlock();
      c.classList.add('open');
      Buber.vibrate(8);
      open.push(c);
      if (open.length < 2) return;

      lock = true;
      const [a, b] = open;
      if (a.dataset.id === b.dataset.id) {
        setTimeout(() => {
          a.classList.replace('open', 'done'); b.classList.replace('open', 'done');
          Buber.sound.pop(); Buber.vibrate([15, 30, 15]);
          found++; paintCount();
          open = []; lock = false;
          if (found === total) finish();
        }, 350);
      } else {
        setTimeout(() => { a.classList.add('wrong'); b.classList.add('wrong'); Buber.sound.error(); Buber.vibrate([40, 30, 40]); }, 350);
        setTimeout(() => {
          a.classList.remove('open', 'wrong'); b.classList.remove('open', 'wrong');
          open = []; lock = false;
        }, 1000);
      }
    });

    function finish() {
      Buber.complete(4);
      Buber.sound.win(); Buber.vibrate([25, 40, 25, 40, 70]);
      Buber.confetti({ count: 140 });
      setTimeout(() => { $('#game').classList.add('hidden'); $('#end').classList.remove('hidden'); }, 1000);
    }
  </script>
</body>
</html>
