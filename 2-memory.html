<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6">
  <title>Bubersurprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..500,100;1,9..144,300..500,100&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=11">
  <style>
    html, body { overflow: hidden; height: 100dvh; }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      gap: 22px;
      z-index: 1;
    }

    .board {
      display: grid;
      gap: 10px;
      width: min(100%, 420px);
      perspective: 900px;
    }
    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .card.open, .card.done { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid; place-items: center;
      overflow: hidden;
    }
    /* dorso: incassato, come le celle del PIN */
    .back {
      background: var(--paper-deep);
      box-shadow: inset 0 2px 6px rgba(31, 29, 26, 0.06);
    }
    .back::after {
      content: '';
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(31, 29, 26, 0.12);
    }
    /* fronte: chiaro, con l'immagine */
    .front {
      transform: rotateY(180deg);
      background: var(--paper-light);
      box-shadow: 0 1px 2px rgba(31, 29, 26, 0.05);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .front img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .card.done .front  { border-color: var(--ok);  box-shadow: 0 0 0 3px var(--sage); }
    .card.wrong .front { border-color: var(--bad); box-shadow: 0 0 0 3px var(--blush); }
    .card.done { cursor: default; }

  </style>
</head>
<body>

  <section id="game" class="screen">
    <div class="board" id="board" aria-label="Memory"></div>
  </section>


  <script src="shared.js?v=11"></script>
  <script>
    Buber.requireStep(3);

    /* ============================================================
       CONFIG — modifica qui
       ============================================================ */
    const CONFIG = {
      // una voce per coppia: una stringa = stessa immagine due volte; una coppia [a, b] = due immagini diverse da accoppiare;
      // oppure { pair: [a, b], sound: 'file audio', boom: true } per far partire un audio e l'esplosione quando si trova.
      // Le immagini sono quadrate (img/memory/, 600×600).
      images: [
        ['img/memory/chitarra.webp', 'img/memory/ukulele.webp'],   // tu con la chitarra + lei con l'ukulele
        ['img/memory/jon.webp', 'img/memory/ygritte.webp'],       // Jon Snow + Ygritte
        'img/memory/specchio.webp',   // selfie allo specchio col gatto nello scatolone
        'img/memory/facce.webp',      // facce vicine, linguaccia
        'img/memory/divano.webp',     // abbracciati sul divano
        'img/memory/denti.webp',      // lavarsi i denti allo specchio
        { pair: ['img/memory/mj.webp', 'img/memory/poggibonsi.webp'], sound: 'media/poggibonsi.mp3', boom: true },  // Michael Jackson + Poggibonsi
        'img/memory/calzini.webp',    // calzini scambiati
      ],
      cols: 4,                 // colonne della griglia (4 → 4 righe con 8 coppie; 3 → 4 righe con 6 coppie)
      next: '3-dolci.html',   // finite le coppie si passa qui da soli, aspettando che l'audio in corso finisca
    };

    const $ = (s) => document.querySelector(s);

    const board = $('#board');
    board.style.gridTemplateColumns = `repeat(${CONFIG.cols}, 1fr)`;

    // mazzo: ogni immagine due volte, mescolato
    const pairs = CONFIG.images.map((e) => Array.isArray(e) ? { pair: e } : typeof e === 'string' ? { pair: [e, e] } : e);
    const deck = pairs.flatMap((p, i) => [{ src: p.pair[0], id: i }, { src: p.pair[1], id: i }]);
    // audio precaricati per le coppie che ne hanno uno
    const sounds = pairs.map((p) => { if (!p.sound) return null; const a = new Audio(p.sound); a.preload = 'auto'; return a; });
    for (let i = deck.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }

    const cards = deck.map((d) => {
      const c = document.createElement('div'); c.className = 'card'; c.dataset.id = d.id;
      c.innerHTML = `<div class="face back"></div><div class="face front"><img src="${d.src}" alt=""></div>`;
      board.appendChild(c);
      return c;
    });

    let open = [], lock = false, found = 0;
    const total = CONFIG.images.length;

    board.addEventListener('click', (e) => {
      const c = e.target.closest('.card');
      if (!c || lock || c.classList.contains('open') || c.classList.contains('done')) return;
      Buber.sound.unlock();
      c.classList.add('open');
      Buber.vibrate(8);
      open.push(c);
      if (open.length < 2) return;

      lock = true;
      const [a, b] = open;
      if (a.dataset.id === b.dataset.id) {
        setTimeout(() => {
          a.classList.replace('open', 'done'); b.classList.replace('open', 'done');
          const p = pairs[+a.dataset.id];
          if (p.boom) {
            for (const el of [a, b]) { const r = el.getBoundingClientRect(); Buber.explode({ x: r.left + r.width / 2, y: r.top + r.height / 2, size: 0.9 }); }
          } else { Buber.sound.pop(); }
          const snd = sounds[+a.dataset.id];
          if (snd) { snd.currentTime = 0; snd.play().catch(() => {}); }
          Buber.vibrate([15, 30, 15]);
          found++;
          open = []; lock = false;
          if (found === total) finish();
        }, 350);
      } else {
        setTimeout(() => { a.classList.add('wrong'); b.classList.add('wrong'); Buber.sound.error(); Buber.vibrate([40, 30, 40]); }, 350);
        setTimeout(() => {
          a.classList.remove('open', 'wrong'); b.classList.remove('open', 'wrong');
          open = []; lock = false;
        }, 1000);
      }
    });

    function finish() {
      Buber.complete(3);
      Buber.vibrate([25, 40, 25, 40, 70]);
      Buber.confetti({ count: 140 });
      // se c'è un audio in corso (Poggibonsi) si aspetta che finisca
      let wait = 0;
      for (const a of sounds) if (a && !a.paused && isFinite(a.duration)) wait = Math.max(wait, (a.duration - a.currentTime) * 1000);
      setTimeout(() => { location.href = CONFIG.next; }, Math.max(1200, wait + 500));
    }
  </script>
</body>
</html>
