<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bubersurprise: qualcosa di bello sta arrivando.">
    <meta name="theme-color" content="#f8f3eb">
    <title>Bubersurprise</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f8f3eb; color: #29233b; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 800px; text-align: center; }
      .symbol { font-size: 80px; }
      h1 { margin: 24px 0; font-size: clamp(2rem, 8vw, 5rem); letter-spacing: -0.06em; overflow-wrap: anywhere; }
      p { margin: 0; font-size: clamp(1rem, 3vw, 1.4rem); line-height: 1.6; color: #655b75; }
      .label { display: inline-block; margin-top: 36px; padding: 10px 18px; border: 1px solid #d6ccdf; border-radius: 999px; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="symbol" aria-hidden="true">🎁</div>
      <h1>Bubersurprise</h1>
      <p>Qualcosa di bello sta arrivando.</p>
      <span class="label">Presto online</span>
    </main>
  </body>
</html>
